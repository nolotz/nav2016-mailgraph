name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    name: Build on Windows and publish GitHub release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches Directory.Build.props
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then echo "VersionPrefix ($VERSION) != tag ($TAG)"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, test (net8.0 + net462) and package
        shell: bash
        run: ./build.sh

      - name: Zip
        shell: bash
        run: |
          # The install docs run deploy\Install-NavMailGraphAddin.ps1 from the extracted release folder
          # (it finds ..\Add-ins\NavMailGraph and ..\SHA256SUMS), so the deploy scripts ship in the zip.
          mkdir -p dist/deploy
          cp deploy/*.ps1 deploy/README.md deploy/s3-iam-policy.json dist/deploy/
          cd dist
          find Add-ins nav deploy -type f | sort | xargs sha256sum > SHA256SUMS
          7z a -tzip "../NavMailGraph-${VERSION}.zip" Add-ins nav deploy SHA256SUMS
          cd ..
          sha256sum "NavMailGraph-${VERSION}.zip" > "NavMailGraph-${VERSION}.zip.sha256"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            NavMailGraph-${{ env.VERSION }}.zip
            NavMailGraph-${{ env.VERSION }}.zip.sha256
